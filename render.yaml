services:
  - type: web
    name: finalsay-backend
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    envVars:
      - key: FINALSAY_DATABASE_URL
        fromDatabase:
          name: finalsay-db
          property: connectionString
      - key: FINALSAY_COMPARISON_MODEL
        value: mock
      - key: FINALSAY_ANCHOR
        value: local
      - key: FINALSAY_JWT_SECRET
        generateValue: true
      - key: FINALSAY_SCRAPE_INTERVAL_SECONDS
        value: "0"
    healthCheckPath: /api/health

databases:
  - name: finalsay-db
    databaseName: finalsay
    plan: free
